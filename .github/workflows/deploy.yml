name: HUB deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # 배포에 필요한 두 개의 GitHub Secret이 비어 있으면 배포 전에 즉시 실패시킵니다.
      - name: Verify Cloudflare secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Next.js 정적 사이트를 ./out에 생성합니다.
      - name: Build Next.js export
        run: npm run build

      # 생성된 ./out을 wrangler 설정에 따라 Cloudflare Workers에 배포합니다.
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 실제 인터넷에서 핵심 공개 경로가 정상 응답하는지 배포 직후 확인합니다.
      # sitemap만 확인하지 않고 홈/robots/llms까지 검사해 외부 도구의 접근 실패를 조기에 잡습니다.
      - name: Verify public endpoints
        run: |
          set -e
          BASE="https://hub.carpick.workers.dev"

          check_text() {
            URL="$1"
            NEEDLE="$2"
            OUT="$3"
            echo "Checking $URL"
            for i in 1 2 3 4 5; do
              if curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "$URL" -o "$OUT"; then
                grep -q "$NEEDLE" "$OUT"
                echo "Passed: $URL"
                return 0
              fi
              echo "Attempt $i failed; waiting 10 seconds for Cloudflare propagation..."
              sleep 10
            done
            echo "Public endpoint check failed: $URL"
            exit 1
          }

          check_text "$BASE/" "HUB" /tmp/hub.html
          check_text "$BASE/robots.txt" "Sitemap:" /tmp/robots.txt
          check_text "$BASE/llms.txt" "HUB" /tmp/llms.txt
          check_text "$BASE/sitemap.xml" "<urlset" /tmp/sitemap.xml
          grep -q "https://hub.carpick.workers.dev/" /tmp/sitemap.xml
          echo "All public endpoint checks passed."
