<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- MOVA 앱 아이콘의 핵심 M 심볼을 작은 파비콘에서도 선명하게 보이도록 벡터로 구성합니다. -->
  <defs>
    <linearGradient id="movaBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35d8e8"/>
      <stop offset="0.55" stop-color="#2167ee"/>
      <stop offset="1" stop-color="#5b3ff0"/>
    </linearGradient>
    <linearGradient id="movaPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8c78ff"/>
      <stop offset="1" stop-color="#b94ff1"/>
    </linearGradient>
  </defs>

  <!-- 생성된 MOVA 아이콘과 같은 밝은 카드형 배경입니다. -->
  <rect width="64" height="64" rx="18" fill="#fff"/>

  <!-- MOVA의 리본형 M 심볼입니다. -->
  <path d="M15 45V22c0-4.2 5.3-6 7.9-2.5L32 32.3l9.1-12.8C43.7 16 49 17.8 49 22v23h-8V29.8l-5.2 7.3a4.6 4.6 0 0 1-7.6 0L23 29.8V45z" fill="url(#movaBlue)"/>
  <path d="M32 32.3 41.1 19.5C43.7 16 49 17.8 49 22v8.3l-8 8.8v-9.3l-5.2 7.3a4.6 4.6 0 0 1-3.8 1.9z" fill="url(#movaPurple)" opacity=".9"/>
</svg>
